name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Build for iOS
    runs-on: macos-13  # Usando macos-13 que costuma ter menos fila que o latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: iOS

      - uses: actions/upload-artifact@v4
        with:
          name: Build-Output-iOS
          path: ${{ steps.build.outputs.build-output }}
