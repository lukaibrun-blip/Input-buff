name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: iOS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Input-buff-iOS
          path: ${{ steps.build.outputs.build-output }}
